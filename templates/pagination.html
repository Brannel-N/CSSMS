{% if page_obj.paginator.num_pages > 1 %}
<nav class="mt-3" aria-label="Pagination">
<ul class="pagination pagination-sm justify-content-center mb-0">
<li class="page-item {% if not previous_url %}disabled{% endif %}">{% if previous_url %}<a class="page-link" href="{{ previous_url }}" aria-label="Previous page">Previous</a>{% else %}<span class="page-link">Previous</span>{% endif %}</li>
{% for link in page_links %}<li class="page-item {% if link.current %}active{% endif %} {% if not link.url %}disabled{% endif %}">{% if link.url %}<a class="page-link" href="{{ link.url }}" {% if link.current %}aria-current="page"{% endif %}>{{ link.number }}</a>{% else %}<span class="page-link">{{ link.number }}</span>{% endif %}</li>{% endfor %}
<li class="page-item {% if not next_url %}disabled{% endif %}">{% if next_url %}<a class="page-link" href="{{ next_url }}" aria-label="Next page">Next</a>{% else %}<span class="page-link">Next</span>{% endif %}</li>
</ul>
</nav>
{% endif %}
